<template>
  <lightning-button
    label="Swap Options"
    onclick={swapOptions}
  ></lightning-button>
  <div class="slds-grid slds-gutters">
    <div class="slds-col slds-size_1-of-3">
      <div class="slds-box slds-theme_default">
        <c-multiselect-combobox
          label="Max 3"
          options={relateToOptions}
          onselected={handleSelected}
          show-pills
          required
          max="3"
        ></c-multiselect-combobox>
      </div>
    </div>

    <div class="slds-col slds-size_1-of-3">
      <div class="slds-box slds-theme_default">
        <c-multiselect-combobox
          label="Min 3"
          options={relateToOptions}
          onselected={handleSelected}
          show-pills
          required
          min="3"
        ></c-multiselect-combobox>
      </div>
    </div>

    <div class="slds-col slds-size_1-of-3">
      <div class="slds-box slds-theme_default">
        <c-multiselect-combobox
          label="No Pills"
          options={relateToOptions}
          onselected={handleSelected}
          required
        ></c-multiselect-combobox>
      </div>
    </div>
  </div>
</template>
